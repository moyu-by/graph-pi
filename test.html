<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graph-PI 测试</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 50px auto; padding: 20px; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        #output { background: #f5f5f5; padding: 15px; margin-top: 20px; border-radius: 5px; white-space: pre-wrap; }
        .success { color: green; }
        .error { color: red; }
    </style>
</head>
<body>
    <h1>Graph-PI 测试页面</h1>
    <p>后端状态: <span id="status">检查中...</span></p>
    
    <h2>测试操作</h2>
    <button onclick="createGraph()">创建 Graph</button>
    <button onclick="listGraphs()">列出所有 Graph</button>
    <button onclick="testWebSocket()">测试 WebSocket</button>
    
    <h2>输出</h2>
    <div id="output"></div>

    <script>
        const API_URL = 'http://localhost:3001';
        const output = document.getElementById('output');
        
        function log(msg, type = 'info') {
            const time = new Date().toLocaleTimeString();
            output.innerHTML += `[${time}] ${msg}\n`;
            output.scrollTop = output.scrollHeight;
        }

        async function checkStatus() {
            try {
                const res = await fetch(`${API_URL}/health`);
                const data = await res.json();
                document.getElementById('status').innerHTML = '<span class="success">✓ 运行中</span>';
                log('后端服务正常');
            } catch (e) {
                document.getElementById('status').innerHTML = '<span class="error">✗ 无法连接</span>';
                log('后端服务错误: ' + e.message, 'error');
            }
        }

        async function createGraph() {
            log('创建新 Graph...');
            try {
                const res = await fetch(`${API_URL}/api/graphs`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title: '测试 Graph ' + Date.now() })
                });
                const data = await res.json();
                log('✓ Graph 创建成功: ' + data.id, 'success');
                log('  标题: ' + data.title);
                log('  根节点: ' + data.rootNodeId);
            } catch (e) {
                log('✗ 创建失败: ' + e.message, 'error');
            }
        }

        async function listGraphs() {
            log('获取 Graph 列表...');
            try {
                const res = await fetch(`${API_URL}/api/graphs`);
                const data = await res.json();
                log('✓ 找到 ' + data.length + ' 个 Graph', 'success');
                data.forEach(g => {
                    log('  - ' + g.title + ' (ID: ' + g.id + ')');
                });
            } catch (e) {
                log('✗ 获取失败: ' + e.message, 'error');
            }
        }

        function testWebSocket() {
            log('测试 WebSocket 连接...');
            try {
                const ws = new WebSocket('ws://localhost:3001');
                ws.onopen = () => {
                    log('✓ WebSocket 连接成功', 'success');
                    ws.send(JSON.stringify({ type: 'select_graph', graphId: 'test' }));
                };
                ws.onmessage = (e) => {
                    log('收到消息: ' + e.data);
                };
                ws.onerror = (e) => {
                    log('✗ WebSocket 错误', 'error');
                };
                ws.onclose = () => {
                    log('WebSocket 连接关闭');
                };
            } catch (e) {
                log('✗ WebSocket 失败: ' + e.message, 'error');
            }
        }

        checkStatus();
    </script>
</body>
</html>
