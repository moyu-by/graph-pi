<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" fill="none">
  <!-- Outer ring -->
  <circle cx="96" cy="96" r="72" stroke="#454d6e" stroke-width="1" stroke-dasharray="3 4" opacity="0.5"/>
  <circle cx="96" cy="96" r="48" stroke="#454d6e" stroke-width="1.5" stroke-dasharray="2 5" opacity="0.6"/>

  <!-- Radial edges from outer satellites to mid ring -->
  <line x1="96" y1="24" x2="96" y2="48" stroke="#6e78a0" stroke-width="1.5" opacity="0.6"/>
  <line x1="158.5" y1="58.5" x2="130" y2="72" stroke="#6e78a0" stroke-width="1.5" opacity="0.6"/>
  <line x1="158.5" y1="133.5" x2="130" y2="120" stroke="#6e78a0" stroke-width="1.5" opacity="0.6"/>
  <line x1="96" y1="168" x2="96" y2="144" stroke="#6e78a0" stroke-width="1.5" opacity="0.6"/>
  <line x1="33.5" y1="133.5" x2="62" y2="120" stroke="#6e78a0" stroke-width="1.5" opacity="0.6"/>
  <line x1="33.5" y1="58.5" x2="62" y2="72" stroke="#6e78a0" stroke-width="1.5" opacity="0.6"/>

  <!-- Cross edges on inner ring -->
  <line x1="48" y1="96" x2="72" y2="96" stroke="#6e78a0" stroke-width="1.2" opacity="0.4"/>
  <line x1="120" y1="96" x2="144" y2="96" stroke="#6e78a0" stroke-width="1.2" opacity="0.4"/>
  <line x1="96" y1="138" x2="96" y2="124" stroke="#6e78a0" stroke-width="1.2" opacity="0.4"/>
  <line x1="96" y1="68" x2="96" y2="54" stroke="#6e78a0" stroke-width="1.2" opacity="0.4"/>

  <!-- Outer satellite nodes -->
  <circle cx="96" cy="24" r="4" fill="#b08cf0" opacity="0.9"/>
  <circle cx="159" cy="59" r="4" fill="#5b9ef0" opacity="0.9"/>
  <circle cx="159" cy="133" r="4" fill="#38c8e0" opacity="0.9"/>
  <circle cx="96" cy="168" r="4" fill="#3edba0" opacity="0.9"/>
  <circle cx="33" cy="133" r="4" fill="#38c8e0" opacity="0.9"/>
  <circle cx="33" cy="59" r="4" fill="#5b9ef0" opacity="0.9"/>

  <!-- Inner ring nodes -->
  <circle cx="96" cy="62" r="3" fill="#7c6cf0" opacity="0.8"/>
  <circle cx="130" cy="88" r="3" fill="#b08cf0" opacity="0.8"/>
  <circle cx="62" cy="88" r="3" fill="#b08cf0" opacity="0.8"/>
  <circle cx="96" cy="130" r="3" fill="#7c6cf0" opacity="0.8"/>

  <!-- Central node -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c6cf0"/>
      <stop offset="50%" stop-color="#5b9ef0"/>
      <stop offset="100%" stop-color="#38c8e0"/>
    </linearGradient>
  </defs>
  <rect x="68" y="68" width="56" height="56" rx="16" fill="url(#g)"/>
  <text x="96" y="101" text-anchor="middle" fill="white" font-family="serif" font-size="32" font-weight="bold">π</text>
</svg>
